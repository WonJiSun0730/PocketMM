# =========================
# Production
# =========================

spring.datasource.url=${PROD_DB_URL}
spring.datasource.username=${PROD_DB_USERNAME}
spring.datasource.password=${PROD_DB_PASSWORD}

pocketmm.content-mode=NORMAL
pocketmm.adult-mode-allowed=false

# Weekend private deployment, behind the existing HTTPS nginx server.
app.private-test.enabled=${PRIVATE_TEST_MODE:true}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-stacktrace=never
management.endpoint.health.show-details=never

# Apply reviewed schema changes during maintenance, never on application startup.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
pocketmm.encryption.required=true
