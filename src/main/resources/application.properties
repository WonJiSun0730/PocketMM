spring.application.name=projectmm

# =========================
# Database
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

gemini.api-key=${GEMINI_API_KEY:}

# RP dialogue generation
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Low-cost time interpretation
gemini.time-model=${GEMINI_TIME_MODEL:gemini-3.5-flash-lite}

# One small extraction request per eligible spoken turn; independent of dialogue model.
gemini.memory-model=${GEMINI_MEMORY_MODEL:gemini-3.5-flash-lite}
chat.memory.enabled=${CHAT_MEMORY_ENABLED:true}
