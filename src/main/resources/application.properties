spring.application.name=projectmm

# Enable on the private weekend deployment; regular development keeps its existing login flow.
app.private-test.enabled=${PRIVATE_TEST_MODE:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =========================
# Database
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =========================
# JPA
# =========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

gemini.api-key=${GEMINI_API_KEY:}

# RP dialogue generation
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Low-cost time interpretation
gemini.time-model=${GEMINI_TIME_MODEL:gemini-3.5-flash-lite}

# One small extraction request per eligible spoken turn; independent of dialogue model.
gemini.memory-model=${GEMINI_MEMORY_MODEL:gemini-3.5-flash-lite}

pocket.background.enabled=${POCKET_BACKGROUND_ENABLED:true}
pocket.background.model=${POCKET_BACKGROUND_MODEL:gemini-3.1-flash-lite-image}
pocket.background.directory=${POCKET_BACKGROUND_DIRECTORY:./data/pocket-backgrounds}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=21MB
chat.memory.enabled=${CHAT_MEMORY_ENABLED:true}

# OpenAI RP dialogue generation
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-5.6-luna}

# Memory extraction is independent of the RP provider; Gemini if configured, otherwise OpenAI.
openai.memory-model=${OPENAI_MEMORY_MODEL:gpt-5.6-luna}
