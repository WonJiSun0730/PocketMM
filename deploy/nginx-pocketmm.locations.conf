# Example location blocks for the existing bloodops.duckdns.org HTTPS server.
# Inspect and back up the existing nginx config first; preserve its SSL certificate settings.
# Do not add these beside conflicting existing location blocks.
root /opt/pocketmm/frontend;
index index.html;
client_max_body_size 21m;

location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
}

location / {
    try_files $uri $uri/ /index.html;
}
